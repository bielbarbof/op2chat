<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://esm.unpkg.com" crossorigin />
  <title>OP2 Chat</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
    body{display:grid;place-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:#8e877e;animation:pulse .65s ease-in-out infinite alternate}
    @keyframes pulse{to{opacity:.25;transform:scale(.72)}}
  </style>
</head>
<body aria-label="Abrindo Chat">
  <span class="dot" aria-hidden="true"></span>
  <script type="module" src="./launcher.js"></script>
</body>
</html>
