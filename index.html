<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#060606" />
  <title>OP2 Playtest // Chat</title>
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section class="chat-column">
      <header class="app-header">
        <div class="brand"><h1>CHAT</h1></div>
        <div class="header-actions">
          <span id="identity" class="identity-pill">...</span>
          <button id="openSheet" class="open-sheet">ABRIR FICHA</button>
        </div>
      </header>
      <section id="feed" class="feed" aria-live="polite"></section>
      <section class="composer"><textarea id="message" maxlength="1800" placeholder="Escreva uma mensagem..."></textarea></section>
      <section class="dice-tray">
        <div id="diceButtons" class="dice-buttons"></div>
        <div class="tray-controls">
          <div class="stepper"><button id="countMinus">−</button><b id="countValue">1</b><button id="countPlus">+</button></div>
          <label class="bonus-field"><span>BÔNUS</span><input id="freeBonus" type="number" value="0" /></label>
          <button id="freeRoll" class="primary">ROLAR</button>
        </div>
      </section>
    </section>
    <div id="loading" class="loading">SINCRONIZANDO...</div>
    <div id="toast" class="toast hidden"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
